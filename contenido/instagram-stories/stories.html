<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaMenAgency Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<style>
  /*
   * Stories de Instagram de PaMenAgency — 1080×1920.
   * Abre este archivo en el navegador para ver la galería, o usa render.mjs
   * para exportar cada story a PNG y MP4 (ver README.md).
   *
   * Zona segura: Instagram tapa ~250px arriba (barra de progreso + perfil)
   * y ~340px abajo (caja de respuesta). Todo el contenido clave va entre
   * y=250 e y=1580.
   */
  :root {
    --ink: #0E0F13;
    --ink-2: #181A21;
    --cream: #F5EEE2;
    --albero: #E4AE4A;      /* el color del albero de Jerez */
    --albero-deep: #B9822A;
    --muted-dark: #9A9AA4;
    --muted-light: #6A6258;
    --sans: "Inter Display", "Inter", system-ui, sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #26272c; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  /* ---------- Galería (vista previa en el navegador) ---------- */
  .gallery { display: flex; flex-wrap: wrap; gap: 28px; padding: 28px 16px; justify-content: center; }
  .gallery .frame { width: 270px; height: 480px; overflow: hidden; border-radius: 18px; position: relative; flex: none; }
  .gallery .frame > .story { transform: scale(.25); transform-origin: 0 0; }
  .gallery .label { color: #c9c9cf; font: 500 13px/1.3 var(--sans); margin-top: 8px; text-align: center; }
  body.single { background: transparent; }
  body.single .gallery { padding: 0; gap: 0; display: block; }
  body.single .frame { width: 1080px; height: 1920px; border-radius: 0; }
  body.single .frame > .story { transform: none; }
  body.single .label { display: none; }

  /* ---------- Base de cada story ---------- */
  .story {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
    padding: 280px 96px 360px; display: flex; flex-direction: column; justify-content: center;
    background: var(--ink); color: var(--cream);
  }
  .story.light { background: var(--cream); color: var(--ink); }
  .story.gold  { background: var(--albero); color: var(--ink); }

  /* Textura: un halo suave que se desplaza muy despacio en el vídeo */
  .story::before {
    content: ""; position: absolute; inset: -20%; pointer-events: none;
    background: radial-gradient(circle at 75% 20%, rgba(228,174,74,.20), transparent 45%),
                radial-gradient(circle at 10% 90%, rgba(228,174,74,.10), transparent 40%);
    animation: drift 6s linear both;
  }
  .story.light::before { background: radial-gradient(circle at 80% 15%, rgba(228,174,74,.35), transparent 45%); }
  .story.gold::before  { background: radial-gradient(circle at 80% 15%, rgba(255,255,255,.35), transparent 45%); }
  @keyframes drift { from { transform: translate3d(0,0,0); } to { transform: translate3d(-4%,3%,0); } }
  .story > * { position: relative; }

  .brand {
    position: absolute; top: 210px; left: 96px; right: 96px;
    display: flex; justify-content: space-between; align-items: center;
    font: 600 26px/1 var(--sans); letter-spacing: .22em; text-transform: uppercase;
  }
  .brand .tag { opacity: .6; letter-spacing: .14em; }
  .brand .logo { display: flex; align-items: center; gap: 14px; }
  .brand .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--albero); }
  .gold .brand .dot { background: var(--ink); }

  .kicker { font: 600 30px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--albero); margin-bottom: 40px; }
  .light .kicker { color: var(--albero-deep); }
  .gold .kicker { color: var(--ink); opacity: .7; }

  h1 { font: 800 132px/.95 var(--sans); letter-spacing: -.035em; }
  h2 { font: 800 96px/1 var(--sans); letter-spacing: -.03em; }
  .serif { font-family: var(--serif); font-weight: 400; font-style: italic; letter-spacing: -.01em; color: var(--albero); }
  .light .serif { color: var(--albero-deep); }
  .gold .serif { color: var(--cream); }
  .lead { font: 400 46px/1.32 var(--sans); margin-top: 48px; opacity: .88; }
  .lead b { font-weight: 700; opacity: 1; }
  .small { font: 400 34px/1.4 var(--sans); opacity: .7; }

  .spacer { flex: 1; }
  .mt-l { margin-top: 72px; }
  .mt-m { margin-top: 40px; }

  /* Listas y tarjetas */
  .list { display: flex; flex-direction: column; gap: 30px; margin-top: 64px; }
  .item { display: flex; gap: 32px; align-items: flex-start; padding: 36px 40px; border-radius: 32px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10); }
  .light .item { background: rgba(14,15,19,.05); border-color: rgba(14,15,19,.10); }
  .gold .item { background: rgba(14,15,19,.08); border-color: rgba(14,15,19,.14); }
  .item .n { font: 800 40px/1 var(--sans); color: var(--albero); min-width: 56px; }
  .light .item .n { color: var(--albero-deep); }
  .item h3 { font: 700 48px/1.1 var(--sans); letter-spacing: -.01em; }
  .item p { font: 400 38px/1.35 var(--sans); opacity: .75; margin-top: 10px; }

  .stats { display: flex; flex-direction: column; gap: 56px; margin-top: 72px; }
  .stat .big { font: 800 200px/.85 var(--sans); letter-spacing: -.05em; }
  .stat .big .serif { font-size: 210px; }
  .stat .cap { font: 500 44px/1.2 var(--sans); margin-top: 14px; opacity: .85; }
  .rule { height: 2px; background: currentColor; opacity: .15; }

  .pill { display: inline-flex; align-items: center; gap: 16px; padding: 22px 36px; border-radius: 999px; font: 600 38px/1 var(--sans); background: var(--albero); color: var(--ink); align-self: flex-start; }
  .gold .pill, .light .pill { background: var(--ink); color: var(--cream); }

  .product-name { font: 800 150px/.9 var(--sans); letter-spacing: -.045em; }
  .chip { display: inline-block; padding: 14px 26px; border-radius: 999px; border: 2px solid currentColor; font: 600 28px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; opacity: .75; align-self: flex-start; margin-bottom: 44px; }

  /* Huecos para stickers que se añaden dentro de Instagram */
  .sticker-slot {
    border: 4px dashed currentColor; border-radius: 40px; opacity: .45;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font: 600 32px/1.3 var(--sans); padding: 40px; min-height: 300px;
  }

  /* Foto del fundador: sustituye assets/foto-fundador.jpg por tu foto */
  .photo {
    width: 640px; height: 800px; border-radius: 44px; overflow: hidden; align-self: center;
    background: linear-gradient(160deg, #2a2b31, #15161a); position: relative;
    box-shadow: 0 40px 80px rgba(0,0,0,.35);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: var(--muted-dark); font: 600 34px/1.3 var(--sans); text-align: center; }
  .photo .ph svg { width: 140px; height: 140px; opacity: .5; }
  .photo.has-img .ph { display: none; }
  .photo .badge { position: absolute; left: 32px; bottom: 32px; padding: 16px 26px; border-radius: 999px; background: var(--albero); color: var(--ink); font: 700 30px/1 var(--sans); }

  .q { font: 800 104px/1 var(--sans); letter-spacing: -.035em; }
  .answer { font: 400 50px/1.32 var(--sans); margin-top: 64px; padding-left: 40px; border-left: 8px solid var(--albero); }
  .gold .answer { border-left-color: var(--ink); }
  .light .answer { border-left-color: var(--albero-deep); }

  .swipe { font: 600 32px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; opacity: .6; display: flex; align-items: center; gap: 16px; }

  /* Portadas de destacadas */
  .cover { justify-content: center; align-items: center; padding: 0; }
  .cover .ring { width: 720px; height: 720px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
  .cover svg { width: 260px; height: 260px; }
  .cover .word { font: 700 64px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }

  /* ---------- Animaciones (el vídeo las recorre fotograma a fotograma) ---------- */
  .r { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .r.d1 { animation-delay: .25s; } .r.d2 { animation-delay: .5s; } .r.d3 { animation-delay: .75s; }
  .r.d4 { animation-delay: 1s; }   .r.d5 { animation-delay: 1.25s; } .r.d6 { animation-delay: 1.5s; }
  .r.d7 { animation-delay: 1.75s; } .r.d8 { animation-delay: 2s; }
  @keyframes rise { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }
  .pop { animation: pop .8s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  .grow { transform-origin: left; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
</style>
</head>

</div>
<script>
  // ?only=<id> muestra una sola story a tamaño real (lo usa render.mjs)
  const only = new URLSearchParams(location.search).get('only');
  const gallery = document.getElementById('gallery');
  if (only) document.body.classList.add('single');
  for (const tpl of [...gallery.querySelectorAll('template')]) {
    if (only && tpl.dataset.id !== only) { tpl.remove(); continue; }
    const wrap = document.createElement('div');
    const frame = document.createElement('div');
    frame.className = 'frame';
    frame.id = tpl.dataset.id;
    frame.appendChild(tpl.content.cloneNode(true));
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = tpl.dataset.label;
    wrap.append(frame, label);
    tpl.replaceWith(wrap);
  }
</script>
