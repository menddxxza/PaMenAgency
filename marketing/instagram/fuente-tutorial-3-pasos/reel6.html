<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel 6 PaMen</title>
<style>
@font-face { font-family: "Anton"; src: url("fonts/Anton.font") format("truetype"); }
@font-face { font-family: "Archivo Black"; src: url("fonts/ArchivoBlack.font") format("truetype"); }
:root { --bg:#0b0b0c; --fg:#fafafa; --acc:#ffe14a; --ink:#0b0b0c; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; background:var(--bg); overflow:hidden; }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--bg); font-family:"Anton", sans-serif; color:var(--fg); }
#glow { position:absolute; inset:-300px; background:radial-gradient(circle at 50% 42%, rgba(255,225,74,.15), transparent 45%); }
#grain { position:absolute; inset:0; opacity:.09; pointer-events:none; mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
#vignette { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65)); pointer-events:none; }
#brand { position:absolute; top:70px; left:0; right:0; text-align:center; font-family:"Archivo Black"; font-size:28px; letter-spacing:.32em; color:rgba(250,250,250,.7); }
#brand b { color:var(--acc); font-weight:400; }
#track { position:absolute; left:0; right:0; top:150px; display:flex; justify-content:center; gap:16px; }
.step { width:70px; height:10px; border-radius:6px; background:rgba(255,225,74,.2); }
.step.on { background:var(--acc); }

.scene { visibility:hidden; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.inner { display:flex; flex-direction:column; align-items:center; padding:0 70px; text-align:center; margin-top:-30px; }
.line { line-height:1.08; text-transform:uppercase; }
.y { color:var(--acc); }

.numwrap { position:relative; margin-bottom:26px; }
.num { font-family:"Anton"; font-size:420px; line-height:.8; color:var(--acc); text-shadow:0 0 90px rgba(255,225,74,.35); }
.numring { position:absolute; inset:-34px; border:5px solid rgba(255,225,74,.25); border-radius:50%; }
.tag { font-family:"Archivo Black"; font-size:32px; letter-spacing:.14em; color:rgba(250,250,250,.65); margin-bottom:16px; }
.inst { font-size:86px; max-width:900px; }

.recap { display:flex; flex-direction:column; gap:30px; align-items:flex-start; }
.ritem { display:flex; align-items:center; gap:26px; font-family:"Archivo Black"; font-size:56px; text-transform:uppercase; }
.rcheck { width:70px; height:70px; border-radius:50%; background:var(--acc); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:40px; flex:none; }

.box { position:relative; display:inline-block; padding:.04em .16em .02em; color:var(--ink); margin-top:.1em; }
.box > i { position:absolute; inset:0; background:var(--acc); transform-origin:0 50%; z-index:0; transform:rotate(-1.3deg); }
.box > span { position:relative; z-index:1; display:inline-block; }

.urlbar { margin-top:60px; display:flex; align-items:center; gap:18px; background:#fff; color:#111; border-radius:999px; padding:24px 42px; font-family:"Inter", sans-serif; font-weight:700; font-size:42px; box-shadow:0 24px 60px rgba(0,0,0,.5), 0 0 0 6px rgba(255,225,74,.25); }
.hint { margin-top:50px; font-family:"Archivo Black"; font-size:36px; letter-spacing:.06em; color:rgba(250,250,250,.85); text-transform:uppercase; }
.hint b { color:var(--acc); font-weight:400; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="brand">PAMEN <b>AGENCY</b></div>
  <div id="track">
    <div class="step" id="p1"></div><div class="step" id="p2"></div><div class="step" id="p3"></div>
  </div>

  <!-- 0 · Intro -->
  <div class="scene" id="s0"><div class="inner">
    <div class="line" style="font-size:102px" id="s0a">CÓMO AUTOMATIZAR</div>
    <div class="line" style="font-size:102px" id="s0b">TU NEGOCIO</div>
    <div class="line" style="font-size:150px; margin-top:16px" id="s0c">EN <span class="y">3 PASOS</span></div>
  </div></div>

  <!-- 1 · Paso 1 -->
  <div class="scene" id="s1"><div class="inner">
    <div class="tag" id="tag1">PASO 1 DE 3</div>
    <div class="numwrap"><div class="numring" id="r1"></div><div class="num" id="n1">1</div></div>
    <div class="line inst" id="i1a">DETECTA LA TAREA</div>
    <div class="line inst" id="i1b">QUE MÁS TIEMPO</div>
    <div class="line inst" id="i1c">TE QUITA</div>
  </div></div>

  <!-- 2 · Paso 2 -->
  <div class="scene" id="s2"><div class="inner">
    <div class="tag" id="tag2">PASO 2 DE 3</div>
    <div class="numwrap"><div class="numring" id="r2"></div><div class="num" id="n2">2</div></div>
    <div class="line inst" id="i2a">AUTOMATÍZALA</div>
    <div class="line inst" id="i2b">CON <span class="y">IA</span></div>
  </div></div>

  <!-- 3 · Paso 3 -->
  <div class="scene" id="s3"><div class="inner">
    <div class="tag" id="tag3">PASO 3 DE 3</div>
    <div class="numwrap"><div class="numring" id="r3"></div><div class="num" id="n3">3</div></div>
    <div class="line inst" id="i3a">DEJA QUE TRABAJE</div>
    <div class="line inst" id="i3b">POR TI, <span class="y">24/7</span></div>
  </div></div>

  <!-- 4 · Recap -->
  <div class="scene" id="s4"><div class="inner">
    <div class="line" style="font-size:72px; margin-bottom:46px" id="s4tag">ASÍ DE FÁCIL ✨</div>
    <div class="recap">
      <div class="ritem" id="rc1"><div class="rcheck">✓</div><div>Detecta</div></div>
      <div class="ritem" id="rc2"><div class="rcheck">✓</div><div>Automatiza</div></div>
      <div class="ritem" id="rc3"><div class="rcheck">✓</div><div>Delega</div></div>
    </div>
  </div></div>

  <!-- 5 · CTA -->
  <div class="scene" id="s5"><div class="inner">
    <div class="line" style="font-size:98px" id="s5a">¿EMPEZAMOS?</div>
    <div class="urlbar" id="s5bar">
      <svg width="34" height="40" viewBox="0 0 24 28" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"><rect x="3" y="12" width="18" height="14" rx="3"/><path d="M7 12V8a5 5 0 0 1 10 0v4"/></svg>
      <span>pamenagency.com</span>
    </div>
    <div class="hint" id="s5hint">👇 O comenta <b>"IA"</b></div>
  </div></div>

  <div id="vignette"></div>
  <div id="grain"></div>
</div>

<script>
const T = 16.5;
const A = [];
const EASE = "cubic-bezier(.16,1,.3,1)";
const POP = "cubic-bezier(.34,1.56,.64,1)";
const $ = id => document.getElementById(id);

function anim(id, kf, start, dur, easing = EASE) {
  const el = typeof id === "string" ? $(id) : id;
  const a = el.animate(kf, { duration: dur * 1000, delay: start * 1000, fill: "both", easing });
  a.pause(); A.push(a);
}
const slam = (id, t, d = .34) => anim(id, [
  { opacity: 0, transform: "scale(1.9) translateY(-10px)", filter: "blur(14px)" },
  { opacity: 1, transform: "scale(1)", filter: "blur(0)" }], t, d);
const rise = (id, t, d = .45) => anim(id, [
  { opacity: 0, transform: "translateY(90px)", filter: "blur(8px)" },
  { opacity: 1, transform: "translateY(0)", filter: "blur(0)" }], t, d);
function boxIn(id, t) {
  const el = $(id);
  anim(el, [{ opacity: 0 }, { opacity: 1 }], t, .01);
  anim(el.querySelector("i"), [{ transform: "rotate(-1.3deg) scaleX(0)" }, { transform: "rotate(-1.3deg) scaleX(1)" }], t, .3);
  anim(el.querySelector("span"), [
    { opacity: 0, transform: "translateX(-40px)" }, { opacity: 1, transform: "translateX(0)" }], t + .1, .32);
}
function scene(id, a, b) {
  const s = $(id);
  const v = s.animate([{ visibility: "visible" }, { visibility: "visible" }], { duration: (b - a) * 1000, delay: a * 1000, fill: "none" });
  v.pause(); A.push(v);
  anim(s.querySelector(".inner"), [
    { opacity: 1, transform: "scale(1)", filter: "blur(0)" },
    { opacity: 0, transform: "scale(1.2)", filter: "blur(14px)" }], b - .14, .14, "ease-in");
}
function numPunch(numId, ringId, t) {
  anim(numId, [
    { opacity: 0, transform: "scale(.2) rotate(-18deg)" },
    { opacity: 1, transform: "scale(1.12) rotate(3deg)" },
    { opacity: 1, transform: "scale(1) rotate(0)" }], t, .5, POP);
  anim(ringId, [{ opacity: 0, transform: "scale(.5)" }, { opacity: 1, transform: "scale(1)" }], t + .1, .4, POP);
}
function stepOn(id, t) { anim(id, [{ background: "rgba(255,225,74,.2)" }, { background: "#ffe14a" }], t, .01, "step-end"); }
const pop = (id, t, d = .45) => anim(id, [
  { opacity: 0, transform: "scale(.4) translateX(-30px)" }, { opacity: 1, transform: "scale(1) translateX(0)" }], t, d, POP);

anim("brand", [{ opacity: 0, transform: "translateY(-20px)" }, { opacity: 1, transform: "none" }], .1, .5);

// 0 · Intro · 0 – 2.5s
scene("s0", 0, 2.5);
rise("s0a", .2); rise("s0b", .45);
slam("s0c", .85, .36);

// 1 · Paso 1 · 2.5 – 5.7s
scene("s1", 2.5, 5.7);
stepOn("p1", 2.52);
rise("tag1", 2.6);
numPunch("n1", "r1", 2.75);
rise("i1a", 3.35); rise("i1b", 3.55); rise("i1c", 3.75);

// 2 · Paso 2 · 5.7 – 8.9s
scene("s2", 5.7, 8.9);
stepOn("p2", 5.72);
rise("tag2", 5.8);
numPunch("n2", "r2", 5.95);
rise("i2a", 6.55); rise("i2b", 6.75);

// 3 · Paso 3 · 8.9 – 12.1s
scene("s3", 8.9, 12.1);
stepOn("p3", 8.92);
rise("tag3", 9.0);
numPunch("n3", "r3", 9.15);
rise("i3a", 9.75); rise("i3b", 9.95);

// 4 · Recap · 12.1 – 14.1s
scene("s4", 12.1, 14.1);
rise("s4tag", 12.18);
pop("rc1", 12.5); pop("rc2", 12.75); pop("rc3", 13.0);

// 5 · CTA · 14.1 – 16.5s
scene("s5", 14.1, T + 1);
slam("s5a", 14.18, .3);
anim("s5bar", [{ opacity: 0, transform: "translateY(70px) scale(.9)" }, { opacity: 1, transform: "none" }], 14.6, .5, POP);
rise("s5hint", 15.2);
anim($("s5bar"), [{ scale: "1" }, { scale: "1.05" }, { scale: "1" }], 15.75, .4, "ease-out");

function seek(t) {
  for (const a of A) a.currentTime = t * 1000;
  const f = Math.floor(t * 30);
  $("grain").style.backgroundPosition = `${(f * 73) % 260}px ${(f * 151) % 260}px`;
  $("glow").style.transform = `translate(${Math.sin(t * .7) * 70}px, ${Math.cos(t * .5) * 100}px)`;
}
window.seek = seek;
window.TOTAL = T;

if (!location.search.includes("render")) {
  const t0 = performance.now();
  (function loop() { seek(((performance.now() - t0) / 1000) % T); requestAnimationFrame(loop); })();
} else seek(0);
</script>
</body>
</html>
