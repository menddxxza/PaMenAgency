<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel 30 PaMen × MecaPro — Expectativa vs realidad del taller</title>
<style>
@font-face { font-family:"Syne"; src:url("fonts/Syne-ExtraBold.font") format("truetype"); font-weight:800; }
@font-face { font-family:"Martian"; src:url("fonts/MartianMono-Medium.font") format("truetype"); font-weight:500; }
@font-face { font-family:"InterTight"; src:url("fonts/InterTight-Medium.font") format("truetype"); font-weight:500; }
:root { --bg:#08070d; --ink:#efeafc; --acc:#9b6bff; --dim:rgba(239,234,252,.52); --ov:rgba(239,234,252,.8); }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:#000; }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--bg); color:var(--ink); font-family:"InterTight", sans-serif; }
.abs { position:absolute; }
.hd { font-family:"Syne", sans-serif; font-weight:800; text-transform:uppercase; line-height:.98; letter-spacing:-.01em; }
.mono { font-family:"Martian", monospace; letter-spacing:.1em; text-transform:uppercase; }
.acc { color:var(--acc); }
#glow { position:absolute; inset:0; background:radial-gradient(ellipse 65% 45% at 50% 55%, rgba(155,107,255,.12), rgba(155,107,255,0) 70%); }
#vig { position:absolute; inset:0; z-index:40; pointer-events:none; opacity:0; background:radial-gradient(ellipse 75% 60% at 50% 50%, rgba(155,107,255,0) 45%, rgba(155,107,255,.38) 100%); }
#grain { position:absolute; left:0; top:0; width:1080px; height:1920px; opacity:.055; pointer-events:none; z-index:45; }
#flash { position:absolute; inset:0; background:var(--acc); opacity:0; z-index:60; pointer-events:none; mix-blend-mode:screen; }

#ov { position:absolute; inset:0; z-index:50; color:var(--ov); pointer-events:none; }
.corner { position:absolute; width:56px; height:56px; border:0 solid currentColor; opacity:.7; }
.corner.tl { left:40px; top:40px; border-left-width:2px; border-top-width:2px; }
.corner.tr { right:40px; top:40px; border-right-width:2px; border-top-width:2px; }
.corner.bl { left:40px; bottom:40px; border-left-width:2px; border-bottom-width:2px; }
.corner.br { right:40px; bottom:40px; border-right-width:2px; border-bottom-width:2px; }
#ov .t1 { font-size:14px; }
#ov .t2 { font-size:10px; color:var(--dim); margin-top:6px; letter-spacing:.08em; }
#sq { display:flex; gap:7px; margin-top:12px; }
#sq i { width:11px; height:11px; border:1.5px solid currentColor; display:block; }
#sq i.on { background:var(--acc); border-color:var(--acc); }

.mask { position:absolute; left:0; right:0; overflow:hidden; }
.hl { position:absolute; left:50%; bottom:0; white-space:nowrap; }
.hl .glow { position:absolute; left:0; bottom:0; color:var(--acc); filter:blur(18px); opacity:.6; }
.hl .sharp { position:relative; }

/* etiqueta expectativa / realidad */
#tags { position:absolute; left:0; right:0; top:200px; display:flex; justify-content:center; gap:18px; }
.tag { position:relative; font-size:22px; padding:12px 20px 11px; border:1.5px solid rgba(239,234,252,.35); border-radius:999px; white-space:nowrap; }
#tgB { border-color:var(--acc); color:#08070d; background:var(--acc); }
#strike { position:absolute; left:8px; right:8px; top:50%; height:3px; background:var(--acc); transform-origin:0 50%; }

/* coche dibujado */
#cam { position:absolute; inset:0; transform-origin:540px 1050px; }
#carSvg { position:absolute; left:0; top:0; overflow:visible; }
#paper { position:absolute; inset:0; perspective:1400px; }
.pp { position:absolute; width:340px; padding:20px 22px 22px; background:#efeafc; color:#08070d; border-radius:10px; transform-origin:50% 50%; }
.pp .pk { font-family:"Martian"; font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:rgba(8,7,13,.6); }
.pp .pt { font-family:"Syne"; font-weight:800; font-size:34px; text-transform:uppercase; line-height:1; margin-top:8px; }
.pp .ln { height:7px; border-radius:4px; background:rgba(8,7,13,.16); margin-top:12px; }
.pp.hot { background:var(--acc); }
#clock { left:0; right:0; top:540px; text-align:center; }
#clockN { font-family:"Syne"; font-weight:800; font-size:92px; color:var(--acc); line-height:1; font-variant-numeric:tabular-nums; }
#clockL { font-size:14px; color:var(--dim); margin-top:8px; }

/* móvil con el panel real */
#persp { position:absolute; inset:0; perspective:1600px; }
#phone { position:absolute; left:282px; top:640px; width:516px; height:940px; border-radius:44px; padding:12px; background:linear-gradient(150deg, #2a2340, #0b0912); transform-origin:50% 50%; }
#screen { width:100%; height:100%; border-radius:34px; overflow:hidden; background:#0b0f10; }
#screen img { width:100%; display:block; }
#pLab { left:0; right:0; top:1606px; text-align:center; font-size:13px; color:var(--dim); }
#sweep { position:absolute; left:0; top:0; width:1080px; height:1920px; z-index:30; pointer-events:none; }

/* cierre */
#lock { position:absolute; left:0; right:0; top:500px; display:flex; justify-content:center; align-items:center; gap:30px; }
#lock img { height:150px; }
#lockW { font-family:"InterTight"; font-weight:500; font-size:118px; letter-spacing:-.02em; white-space:nowrap; }
#soon { left:0; right:0; top:700px; text-align:center; font-size:22px; color:var(--acc); letter-spacing:.4em; }
#pill { position:absolute; left:50%; top:1150px; font-family:"InterTight"; font-weight:500; font-size:34px; color:#08070d; background:var(--acc); padding:18px 36px; border-radius:999px; white-space:nowrap; box-shadow:0 0 50px rgba(155,107,255,.45); }
#eUrl { left:0; right:0; top:1268px; text-align:center; font-size:13px; color:var(--dim); }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>

  <div id="tags"><div class="tag mono" id="tgA">Expectativa<div id="strike"></div></div><div class="tag mono" id="tgB">Realidad</div></div>

  <div class="mask" style="top:290px; height:112px;"><div class="hl hd" id="h0a" style="font-size:78px;"></div></div>
  <div class="mask" style="top:392px; height:112px;"><div class="hl hd" id="h0b" style="font-size:78px;"></div></div>
  <div class="mask" style="top:290px; height:112px;"><div class="hl hd" id="h1a" style="font-size:78px;"></div></div>
  <div class="mask" style="top:392px; height:112px;"><div class="hl hd" id="h1b" style="font-size:78px;"></div></div>
  <div class="mask" style="top:290px; height:112px;"><div class="hl hd" id="h2a" style="font-size:78px;"></div></div>
  <div class="mask" style="top:392px; height:112px;"><div class="hl hd" id="h2b" style="font-size:78px;"></div></div>
  <div class="mask" style="top:290px; height:112px;"><div class="hl hd" id="h3a" style="font-size:78px;"></div></div>
  <div class="mask" style="top:392px; height:112px;"><div class="hl hd" id="h3b" style="font-size:78px;"></div></div>

  <div id="clock" class="abs"><div id="clockN">19:02</div><div id="clockL" class="mono">sigues en el taller</div></div>

  <div id="cam">
    <svg id="carSvg" width="1080" height="1920">
      <defs><filter id="bl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter></defs>
      <g id="car" transform="translate(130 860) scale(1.37)">
        <path id="lift1" d="M120 300 V214 M480 300 V214 M70 300 H530" fill="none" stroke="rgba(239,234,252,.35)" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="100"/>
        <path id="carG" d="M30 168 V128 Q34 108 70 102 L170 92 Q214 52 276 44 L388 44 Q440 48 482 92 L548 102 Q572 108 572 136 V168 Z" fill="none" stroke="#9b6bff" stroke-width="12" filter="url(#bl)" opacity=".7" pathLength="100" stroke-dasharray="100"/>
        <path id="carB" d="M30 168 V128 Q34 108 70 102 L170 92 Q214 52 276 44 L388 44 Q440 48 482 92 L548 102 Q572 108 572 136 V168 Z" fill="none" stroke="#efeafc" stroke-width="6" stroke-linejoin="round" pathLength="100" stroke-dasharray="100"/>
        <path id="carW" d="M196 92 L262 58 L330 58 L330 92 Z M350 92 L350 58 L392 58 Q430 62 456 92 Z" fill="none" stroke="rgba(239,234,252,.5)" stroke-width="4" pathLength="100" stroke-dasharray="100"/>
        <circle id="wh1" cx="150" cy="170" r="40" fill="#08070d" stroke="#efeafc" stroke-width="6" pathLength="100" stroke-dasharray="100"/>
        <circle id="wh2" cx="456" cy="170" r="40" fill="#08070d" stroke="#efeafc" stroke-width="6" pathLength="100" stroke-dasharray="100"/>
        <g id="wrench" transform="translate(300 -50)"><path id="wrP" d="M-30 30 L18 -18 M18 -18 A22 22 0 1 1 40 -40 L30 -30 L40 -20 L50 -30 A22 22 0 0 1 18 -18" fill="none" stroke="#9b6bff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100"/></g>
      </g>
    </svg>
    <div id="paper"></div>
  </div>
  <canvas id="sweep" width="1080" height="1920"></canvas>

  <div id="persp"><div id="phone"><div id="screen"><img src="img/panel.png" alt=""></div></div></div>
  <div id="pLab" class="abs mono">panel de mecapro · interfaz real</div>

  <div id="lock"><img src="img/mecapro-icon.png" alt="MecaPro"><div id="lockW">MecaPro</div></div>
  <div id="soon" class="abs mono">próximamente</div>
  <div class="mask" style="top:790px; height:130px;"><div class="hl hd" id="e1" style="font-size:108px;"></div></div>
  <div class="mask" style="top:905px; height:130px;"><div class="hl hd" id="e2" style="font-size:108px;"></div></div>
  <div id="pill">Etiqueta a un mecánico →</div>
  <div id="eUrl" class="abs mono">un producto de pamenagency</div>

  <div id="vig"></div>
  <div id="ov">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="abs mono" style="left:58px; top:56px;"><div class="t1">PAMEN AGENCY&nbsp;&nbsp;2026</div><div class="t2">MECAPRO · GESTIÓN DE TALLERES</div><div id="sq"><i></i><i></i><i></i><i></i></div></div>
    <div class="abs mono" style="right:58px; top:56px; text-align:right;"><div class="t1" id="tc">TC 00:00:00:00</div><div class="t2">9:16 / 60 FPS</div></div>
    <div class="abs mono" id="chap" style="left:58px; bottom:54px; font-size:12px;"></div>
    <div class="abs mono" style="right:58px; bottom:54px; font-size:12px; letter-spacing:.04em; text-transform:none;">PaMenAgency × MecaPro</div>
  </div>
  <canvas id="grain" width="360" height="640"></canvas>
  <div id="flash"></div>
</div>

<script>
const T = 12.6, FPS = 60;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = k => 1 - Math.pow(1 - k, 3);
const eExpo = k => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
const eIO = k => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const eIn = k => k * k * k;
const eBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
let seed = 30; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const css = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const rise = (el, k) => { el.style.transform = `translateX(-50%) translateY(${((1 - k) * 108).toFixed(2)}%)`; el.style.visibility = k <= .001 ? "hidden" : ""; };
const hl = html => `<span class="glow">${html}</span><span class="sharp">${html}</span>`;
const updown = (t, a, c, dur = .36) => eOut(P(t, a, a + dur)) * (1 - eIO(P(t, c, c + .26)));

const CH = [["01 — LA EXPECTATIVA", 0, 3.1], ["02 — LA REALIDAD", 3.1, 7.2], ["03 — MECAPRO", 7.2, 9.7], ["04 — TU TURNO", 9.7, T]];
const CUT = 3.1, SUCK = 7.25;
// [etiqueta, título, x, y, giro final, llegada, destacado]
const PAPERS = [
  ["presupuesto nº 214", "Presupuesto", 70, 760, -9, 3.35, 0],
  ["llamadas perdidas", "3 llamadas", 650, 720, 8, 3.7, 0],
  ["factura", "IVA 21 %", 380, 900, -4, 4.0, 0],
  ["whatsapp", "¿Ya está mi coche?", 120, 1060, 6, 4.3, 1],
  ["pedido", "Pastillas x4", 640, 1040, -11, 4.55, 0],
  ["albarán", "Proveedor", 300, 1230, 10, 4.8, 0],
  ["agenda", "Cita 9:30", 700, 1260, -6, 5.02, 0],
  ["post-it", "¡¡Llamar a Rosa!!", 60, 1380, -14, 5.22, 0],
  ["factura", "Pendiente de cobro", 420, 1440, 5, 5.4, 0],
];
const FLY = .42;

/* ---------- construcción ---------- */
[["h0a", "Tu taller:"], ["h0b", '<span class="acc">solo coches.</span>'], ["h1a", "La realidad:"], ["h1b", '<span class="acc">papeles.</span>'],
 ["h2a", "Que lo lleve"], ["h2b", '<span class="acc">MecaPro.</span>'], ["h3a", "Y tú, a"], ["h3b", '<span class="acc">los coches.</span>'],
 ["e1", "Comenta"], ["e2", '<span class="acc">“IA”.</span>']].forEach(([id, h]) => $(id).innerHTML = hl(h));
$("paper").innerHTML = PAPERS.map((p, i) => `<div class="pp${p[6] ? " hot" : ""}" id="pp${i}"><div class="pk">${p[0]}</div><div class="pt">${p[1]}</div><div class="ln" style="width:86%"></div><div class="ln" style="width:62%"></div></div>`).join("");
const PR = PAPERS.map(() => ({ sx: rnd() * 1080, sr: (rnd() - .5) * 140, rx: (rnd() - .5) * 70, ry: (rnd() - .5) * 70, sp: (rnd() < .5 ? -1 : 1) * (1.6 + rnd() * 1.4) }));

const gctx = $("grain").getContext("2d"), GR = [];
for (let f = 0; f < 4; f++) {
  const img = gctx.createImageData(360, 640);
  for (let i = 0; i < img.data.length; i += 4) { const v = rnd() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  GR.push(img);
}
const STREAKS = [];
for (let i = 0; i < 60; i++) STREAKS.push({ a: rnd() * Math.PI * 2, r: 300 + rnd() * 700, l: 40 + rnd() * 120, d: rnd() * .35, red: rnd() < .4 });
const dash = (id, k) => $(id).setAttribute("stroke-dashoffset", (100 * (1 - k)).toFixed(2));

/* ---------- seek ---------- */
function seek(t) {
  t = clamp(t, 0, T - 1e-6);
  const fr = Math.floor(t * FPS + 1e-6), ss = Math.floor(fr / FPS);
  const ci = CH.findIndex(c => t >= c[1] && t < c[2]);
  $("tc").textContent = `TC 00:00:${String(ss).padStart(2, "0")}:${String(fr % FPS).padStart(2, "0")}`;
  $("chap").textContent = CH[ci][0];
  document.querySelectorAll("#sq i").forEach((el, i) => el.classList.toggle("on", i <= ci));
  gctx.putImageData(GR[fr % 4], 0, 0);

  // titulares
  rise($("h0a"), updown(t, 0, 2.85, .28)); rise($("h0b"), updown(t, .05, 2.89, .28));
  rise($("h1a"), updown(t, 3.2, 6.95)); rise($("h1b"), updown(t, 3.27, 6.99));
  rise($("h2a"), updown(t, 7.35, 8.55)); rise($("h2b"), updown(t, 7.42, 8.59));
  rise($("h3a"), updown(t, 8.7, 9.45)); rise($("h3b"), updown(t, 8.77, 9.49));

  // etiquetas: expectativa -> tachada -> realidad
  const tagOut = eIO(P(t, 7.0, 7.3));
  const tA = eOut(P(t, .05, .35));
  css($("tags"), { opacity: (tA * (1 - tagOut)).toFixed(3), transform: `translateY(${((1 - tA) * -20).toFixed(1)}px)` });
  $("strike").style.transform = `scaleX(${eIO(P(t, CUT, CUT + .3)).toFixed(3)})`;
  css($("tgA"), { opacity: lerp(1, .55, P(t, CUT, CUT + .3)).toFixed(3) });
  const tB = eBack(P(t, CUT + .15, CUT + .5));
  css($("tgB"), { opacity: P(t, CUT + .15, CUT + .25).toFixed(3), transform: `scale(${(t < CUT + .15 ? .5 : lerp(.5, 1, tB)).toFixed(3)})`, display: t < CUT ? "none" : "" });

  // coche que se dibuja (expectativa)
  dash("lift1", eIO(P(t, .3, 1.1)));
  dash("carG", eIO(P(t, .45, 1.65))); dash("carB", eIO(P(t, .45, 1.65)));
  dash("carW", eIO(P(t, 1.2, 1.9)));
  dash("wh1", eIO(P(t, 1.0, 1.6))); dash("wh2", eIO(P(t, 1.1, 1.7)));
  $("wh1").style.opacity = t < 1.0 ? 0 : 1; $("wh2").style.opacity = t < 1.1 ? 0 : 1;
  dash("wrP", eIO(P(t, 1.8, 2.5)));
  const wrot = t > 2.5 ? Math.sin((t - 2.5) * 9) * 14 * Math.exp(-(t - 2.5) * 2) : 0;
  $("wrench").setAttribute("transform", `translate(300 -50) rotate(${wrot.toFixed(2)})`);
  // con la realidad el coche se apaga bajo el papeleo; vuelve con MecaPro
  const carDim = lerp(1, .35, P(t, CUT, 5.6)) * (1 - P(t, SUCK + .1, SUCK + .4));
  $("car").style.opacity = carDim.toFixed(3);

  // reloj que corre hasta tarde
  const ck = eOut(P(t, 3.5, 3.8)) * (1 - P(t, 6.95, 7.2));
  const mins = Math.round(lerp(19 * 60 + 2, 23 * 60 + 47, eExpo(P(t, 3.6, 6.4))));
  $("clockN").textContent = `${String(Math.floor(mins / 60)).padStart(2, "0")}:${String(mins % 60).padStart(2, "0")}`;
  css($("clock"), { opacity: ck.toFixed(3) });

  // papeles que caen en 3D y luego MecaPro los absorbe en espiral
  let shake = 0;
  PAPERS.forEach((p, i) => {
    const el = $("pp" + i), r = PR[i];
    const [, , x, y, rot, ta] = p;
    if (t < ta) { el.style.opacity = 0; return; }
    const k = eOut(P(t, ta, ta + FLY)), land = eBack(P(t, ta + FLY * .7, ta + FLY + .2));
    let px = lerp(r.sx - 170, x, k), py = lerp(-420, y, k), pr = lerp(r.sr, rot, k), rx = lerp(r.rx, 0, k), ry = lerp(r.ry, 0, k);
    let sc = lerp(1.25, 1, k) * (k >= 1 ? lerp(1.06, 1, land) : 1), op = 1;
    const sk = eIn(P(t, SUCK + i * .045, SUCK + .55 + i * .045));
    if (sk > 0) {
      const cx = 540 - 170, cy = 1090 - 80;
      const ang = sk * r.sp * Math.PI;
      const dx = px - cx, dy = py - cy;
      px = cx + (dx * Math.cos(ang) - dy * Math.sin(ang)) * (1 - sk);
      py = cy + (dx * Math.sin(ang) + dy * Math.cos(ang)) * (1 - sk);
      pr += sk * r.sp * 220; sc *= lerp(1, .08, sk); op = 1 - P(sk, .75, 1);
    }
    css(el, { opacity: op.toFixed(3), left: `${px.toFixed(1)}px`, top: `${py.toFixed(1)}px`, transform: `rotateX(${rx.toFixed(1)}deg) rotateY(${ry.toFixed(1)}deg) rotate(${pr.toFixed(2)}deg) scale(${sc.toFixed(3)})`, zIndex: String(10 + i) });
    const d = t - ta - FLY;
    if (d >= 0 && d < .4) shake = Math.max(shake, (i === PAPERS.length - 1 ? 13 : 3 + i * .9) * Math.exp(-d * 12));
  });
  if (t >= CUT && t < CUT + .4) shake = Math.max(shake, 16 * Math.exp(-(t - CUT) * 10));
  const sx = shake ? Math.sin(t * 95) * shake : 0, sy = shake ? Math.cos(t * 120) * shake * .7 : 0;
  const push = eIO(P(t, 4.0, 6.8)) * (1 - eIO(P(t, SUCK, SUCK + .5)));
  css($("cam"), { transform: `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px) scale(${(1 + .07 * push).toFixed(4)}) rotate(${(-1.2 * push).toFixed(3)}deg)` });
  $("vig").style.opacity = (Math.max(t >= 5.4 ? .9 * Math.exp(-(t - 5.4) * 1.8) : 0, t >= CUT ? .6 * Math.exp(-(t - CUT) * 4) : 0) * (t < SUCK ? 1 : 0)).toFixed(3);

  // estelas que convergen hacia el móvil durante la absorción
  const sc2 = $("sweep").getContext("2d");
  sc2.clearRect(0, 0, 1080, 1920);
  const st = t - SUCK;
  if (st >= 0 && st < .9) {
    sc2.lineCap = "round";
    for (const s of STREAKS) {
      const q = clamp((st - s.d) / .5); if (q <= 0 || q >= 1) continue;
      const rr = s.r * (1 - eIn(q)), x0 = 540 + Math.cos(s.a) * rr, y0 = 1090 + Math.sin(s.a) * rr * 1.2;
      const x1 = 540 + Math.cos(s.a) * (rr + s.l), y1 = 1090 + Math.sin(s.a) * (rr + s.l) * 1.2;
      sc2.globalAlpha = Math.sin(q * Math.PI) * .9;
      sc2.strokeStyle = s.red ? "#9b6bff" : "#efeafc"; sc2.lineWidth = 3;
      sc2.beginPath(); sc2.moveTo(x0, y0); sc2.lineTo(x1, y1); sc2.stroke();
    }
    sc2.globalAlpha = 1;
  }

  // móvil con el panel real: aparece girando sobre sí mismo
  const pin = eBack(P(t, SUCK + .55, SUCK + 1.15)), spin = eOut(P(t, SUCK + .55, SUCK + 1.3)), pout = eIO(P(t, 9.35, 9.65));
  css($("phone"), {
    opacity: t < SUCK + .55 ? 0 : (P(t, SUCK + .55, SUCK + .7) * (1 - pout)).toFixed(3),
    transform: `rotateY(${lerp(-180, -6, spin).toFixed(2)}deg) rotateX(${lerp(10, 2, spin).toFixed(2)}deg) scale(${(lerp(.25, 1, pin) * lerp(1, .9, pout)).toFixed(4)})`,
    boxShadow: `0 60px 120px rgba(0,0,0,.65), 0 0 ${(80 * spin).toFixed(0)}px rgba(155,107,255,.28)`,
  });
  $("screen").style.visibility = Math.abs(lerp(-180, -6, spin)) > 90 ? "hidden" : "";
  $("pLab").style.opacity = (P(t, 8.3, 8.6) * (1 - pout)).toFixed(3);

  // flashes
  let fl = 0;
  if (t >= CUT) fl = Math.max(fl, .45 * Math.exp(-(t - CUT) * 9));
  if (t >= SUCK + .55) fl = Math.max(fl, .3 * Math.exp(-(t - SUCK - .55) * 10));
  if (t >= 9.7) fl = Math.max(fl, .3 * Math.exp(-(t - 9.7) * 12));
  $("flash").style.opacity = fl.toFixed(3);

  // cierre
  const lk = eIO(P(t, 9.8, 10.4));
  css($("lock"), { clipPath: `inset(0 ${((1 - lk) * 100).toFixed(2)}% 0 0)`, opacity: t >= 9.8 ? 1 : 0, transform: `translateX(${((1 - lk) * -30).toFixed(1)}px)` });
  $("soon").style.opacity = eOut(P(t, 10.25, 10.6)).toFixed(3);
  rise($("e1"), eOut(P(t, 10.4, 10.8)));
  rise($("e2"), eOut(P(t, 10.5, 10.9)));
  const pk = eBack(P(t, 11.05, 11.5)), pls = t > 11.75 ? 1 + Math.sin((t - 11.75) * 10) * .025 : 1;
  css($("pill"), { opacity: P(t, 11.05, 11.2).toFixed(3), transform: `translateX(-50%) scale(${(lerp(.8, 1, pk) * pls).toFixed(3)})` });
  $("eUrl").style.opacity = P(t, 11.35, 11.75).toFixed(3);
}
window.seek = seek;
window.TOTAL = T;

if (!location.search.includes("render")) {
  const t0 = performance.now();
  (function loop() { seek(((performance.now() - t0) / 1000) % T); requestAnimationFrame(loop); })();
} else seek(0);
</script>
