<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel 14 PaMen</title>
<style>
@font-face { font-family: "Anton"; src: url("fonts/Anton.font") format("truetype"); }
@font-face { font-family: "Archivo Black"; src: url("fonts/ArchivoBlack.font") format("truetype"); }
:root { --cy:#00f0ff; --mg:#ff2bd6; --acc:#ffe14a; --bg:#04010d; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:var(--bg); }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:radial-gradient(ellipse at 50% 50%, #120a33 0%, var(--bg) 65%); perspective:1000px; perspective-origin:50% 50%; color:#fff; font-family:"Anton", sans-serif; }
#warp { position:absolute; inset:0; width:1080px; height:1920px; }
#world { position:absolute; left:540px; top:960px; width:0; height:0; transform-style:preserve-3d; }
.obj { position:absolute; transform-style:preserve-3d; }
.ring { position:absolute; border-radius:50%; border:10px solid var(--cy); box-shadow:0 0 40px var(--cy), inset 0 0 40px var(--cy); }
.ring.m { border-color:var(--mg); box-shadow:0 0 40px var(--mg), inset 0 0 40px var(--mg); }
.card { position:absolute; width:600px; height:340px; margin:-170px 0 0 -300px; border-radius:36px; background:rgba(10,6,30,.72); border:4px solid var(--cy);
  box-shadow:0 0 50px rgba(0,240,255,.55), inset 0 0 40px rgba(0,240,255,.18); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.card.m { border-color:var(--mg); box-shadow:0 0 50px rgba(255,43,214,.55), inset 0 0 40px rgba(255,43,214,.18); }
.card .ic { font-size:96px; line-height:1; margin-bottom:16px; }
.card .tx { font-size:76px; line-height:1; text-transform:uppercase; letter-spacing:.01em; }
.card .sm { font-family:"Archivo Black"; font-size:24px; letter-spacing:.18em; color:rgba(255,255,255,.65); margin-top:12px; }

.ov { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none; }
.neon { text-transform:uppercase; line-height:.95; }
.neon.c { color:#eaffff; text-shadow:0 0 18px var(--cy), 0 0 60px var(--cy); }
.neon.m { color:#ffe9fb; text-shadow:0 0 18px var(--mg), 0 0 60px var(--mg); }
#flash { position:absolute; inset:0; background:#fff; opacity:0; }
#brand { position:absolute; top:70px; left:0; right:0; text-align:center; font-family:"Archivo Black"; font-size:28px; letter-spacing:.4em; color:rgba(255,255,255,.75); }
#cta .tag { font-family:"Archivo Black"; font-size:34px; letter-spacing:.3em; color:var(--cy); margin-bottom:30px; text-shadow:0 0 20px var(--cy); }
#cta .url { margin-top:60px; font-family:"Archivo Black"; font-size:52px; padding:24px 50px; border-radius:999px; border:4px solid var(--acc); color:var(--acc); box-shadow:0 0 40px rgba(255,225,74,.5), inset 0 0 30px rgba(255,225,74,.15); }
#cta .cm { margin-top:40px; font-family:"Archivo Black"; font-size:38px; letter-spacing:.06em; }
#cta .cm b { color:#04010d; background:var(--acc); padding:2px 16px; font-weight:400; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="warp"></canvas>
  <div id="world"></div>

  <div class="ov" id="intro">
    <div class="neon c" id="i1" style="font-size:190px">TU NEGOCIO</div>
    <div class="neon m" id="i2" style="font-size:150px; margin-top:20px">VERSIÓN 2.0</div>
  </div>
  <div class="ov" id="leap"><div class="neon c" id="l1" style="font-size:132px">¿LISTO PARA<br>EL SALTO?</div></div>
  <div id="flash"></div>
  <div class="ov" id="cta">
    <div class="tag" id="c0">BIENVENIDO AL FUTURO</div>
    <div class="neon m" id="c1" style="font-size:170px">PAMEN</div>
    <div class="neon c" id="c2" style="font-size:170px">AGENCY</div>
    <div class="url" id="c3">pamenagency.com</div>
    <div class="cm" id="c4">COMENTA <b>IA</b> Y DESPEGAMOS 🚀</div>
  </div>
  <div id="brand">PAMEN AGENCY</div>
</div>

<script>
const T = 15.5;
const A = [];
const EASE = "cubic-bezier(.16,1,.3,1)";
const $ = id => document.getElementById(id);
function anim(id, kf, start, dur, easing = EASE, fill = "both") {
  const el = typeof id === "string" ? $(id) : id;
  const a = el.animate(kf, { duration: dur * 1000, delay: start * 1000, fill, easing });
  a.pause(); A.push(a);
}
const smooth = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- mundo 3D ----------
const D = 1000; // perspectiva
const objs = [];
function add(el, x, y, z) { el.classList.add("obj"); $("world").appendChild(el); objs.push({ el, x, y, z }); return el; }
// túnel de anillos
for (let i = 0; i < 16; i++) {
  const r = document.createElement("div"); r.className = "ring" + (i % 2 ? " m" : "");
  const s = 1500; Object.assign(r.style, { width: s + "px", height: s + "px", left: -s / 2 + "px", top: -s / 2 + "px" });
  add(r, 0, 0, -1000 - i * 700).ring = true;
  objs[objs.length - 1].ring = true;
}
// tarjetas
const CARDS = [["💬", "RESPONDE SOLO", "24 HORAS · 7 DÍAS"], ["📅", "AGENDA SOLO", "SIN LLAMADAS"], ["💰", "VENDE SOLO", "MIENTRAS TRABAJAS"], ["🌙", "NUNCA DUERME", "NI EN FESTIVOS"]];
const CARD_Z = [-2000, -4000, -6000, -8000];
CARDS.forEach(([ic, tx, sm], k) => {
  const c = document.createElement("div"); c.className = "card" + (k % 2 ? " m" : "");
  c.innerHTML = `<div class="ic">${ic}</div><div class="tx">${tx}</div><div class="sm">${sm}</div>`;
  add(c, 0, 0, CARD_Z[k]).card = true; objs[objs.length - 1].card = true;
});
// portal final
const portal = document.createElement("div"); portal.className = "ring";
Object.assign(portal.style, { width: "1000px", height: "1000px", left: "-500px", top: "-500px", borderWidth: "22px", borderColor: "#ffe14a", boxShadow: "0 0 80px #ffe14a, inset 0 0 80px #ffe14a" });
add(portal, 0, 0, -10000); objs[objs.length - 1].portal = true;

// cámara: [t, z]
const CAM = [[0, -400], [2.6, 0], [3.5, 1100], [4.4, 1250], [5.2, 3100], [6.1, 3250], [6.9, 5100], [7.8, 5250], [8.6, 7100], [9.5, 7250], [10.6, 8900], [12.0, 9100], [12.45, 10300], [T, 10300]];
function camZ(t) {
  for (let i = 0; i < CAM.length - 1; i++) {
    const [t0, z0] = CAM[i], [t1, z1] = CAM[i + 1];
    if (t >= t0 && t <= t1) return z0 + (z1 - z0) * smooth((t - t0) / (t1 - t0));
  }
  return CAM[CAM.length - 1][1];
}

// ---------- estelas warp (canvas) ----------
const cv = $("warp"), dpr = window.devicePixelRatio || 1;
cv.width = 1080 * dpr; cv.height = 1920 * dpr;
const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const STARS = Array.from({ length: 260 }, () => ({ a: rnd() * Math.PI * 2, r: 120 + rnd() * 900, z: rnd() * 3000, c: rnd() < .5 ? "0,240,255" : (rnd() < .5 ? "255,43,214" : "255,255,255") }));
function drawWarp(cam, speed) {
  ctx.clearRect(0, 0, 1080, 1920);
  const stretch = clamp(speed / 1500, 0, 1.6);
  for (const s of STARS) {
    const z = ((s.z - cam) % 3000 + 3000) % 3000 + 60;
    const k = D / z, k2 = D / (z + 40 + stretch * 600);
    const x = Math.cos(s.a) * s.r, y = Math.sin(s.a) * s.r;
    const alpha = clamp(1 - z / 3000, 0, 1);
    ctx.strokeStyle = `rgba(${s.c},${alpha})`;
    ctx.lineWidth = clamp(2.5 * k, .6, 5);
    ctx.beginPath(); ctx.moveTo(540 + x * k2, 960 + y * k2); ctx.lineTo(540 + x * k, 960 + y * k); ctx.stroke();
  }
}

// ---------- capas 2D ----------
anim("i1", [{ opacity: 0, transform: "scale(.2)", filter: "blur(20px)" }, { opacity: 1, transform: "scale(1)", filter: "blur(0)" }], .1, 1.1);
anim("i2", [{ opacity: 0, transform: "scale(.2)", filter: "blur(20px)" }, { opacity: 1, transform: "scale(1)", filter: "blur(0)" }], .55, 1.1);
anim("intro", [{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(3.2)" }], 2.35, .55, "cubic-bezier(.6,0,.9,.4)", "forwards");
anim("leap", [{ opacity: 0, transform: "scale(.6)" }, { opacity: 1, transform: "scale(1)" }], 10.5, .6, EASE);
anim("leap", [{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(3)" }], 12.0, .4, "ease-in", "forwards");
anim("flash", [{ opacity: 0 }, { opacity: 1, offset: .35 }, { opacity: 0 }], 12.3, .7, "linear");
anim("cta", [{ opacity: 0 }, { opacity: 1 }], 12.55, .01, "linear");
anim("c0", [{ opacity: 0, letterSpacing: ".8em" }, { opacity: 1, letterSpacing: ".3em" }], 12.6, .8);
anim("c1", [{ opacity: 0, transform: "translateZ(0) scale(1.6)", filter: "blur(16px)" }, { opacity: 1, transform: "scale(1)", filter: "blur(0)" }], 12.7, .7);
anim("c2", [{ opacity: 0, transform: "scale(1.6)", filter: "blur(16px)" }, { opacity: 1, transform: "scale(1)", filter: "blur(0)" }], 12.9, .7);
anim("c3", [{ opacity: 0, transform: "translateY(40px)" }, { opacity: 1, transform: "none" }], 13.5, .55);
anim("c4", [{ opacity: 0 }, { opacity: 1 }], 14.0, .5);
anim("brand", [{ opacity: 1 }, { opacity: 0 }], 12.4, .3, "linear", "forwards");

function seek(t) {
  for (const a of A) a.currentTime = t * 1000;
  const cam = camZ(t), speed = (camZ(t + 1 / 120) - cam) * 120;
  drawWarp(cam, Math.abs(speed));
  for (const o of objs) {
    const d = o.z + cam;                       // distancia negativa = delante de la cámara
    const dist = -d;
    o.el.style.transform = `translate3d(${o.x}px, ${o.y}px, ${d + D}px)`;  // ojo de la cámara a D px del plano
    if (o.card) {
      const fadeFar = clamp((4200 - dist) / 1400, 0, 1), fadeNear = clamp((dist - 160) / 300, 0, 1);
      o.el.style.opacity = Math.min(fadeFar, fadeNear);
      o.el.style.filter = `blur(${clamp((dist - 760) / 350, 0, 9).toFixed(2)}px)`;
      o.el.style.visibility = dist < 120 || dist > 4400 || t < 2.45 ? "hidden" : "visible";
    } else {
      o.el.style.opacity = clamp((7000 - dist) / 3000, 0, 1) * clamp((dist - 60) / 400, 0, 1);
      o.el.style.visibility = dist < 40 || dist > 7200 ? "hidden" : "visible";
    }
  }
  // el portal palpita
  portal.style.borderWidth = (22 + Math.sin(t * 6) * 5) + "px";
}
window.seek = seek;
window.TOTAL = T;

if (!location.search.includes("render")) {
  const t0 = performance.now();
  (function loop() { seek(((performance.now() - t0) / 1000) % T); requestAnimationFrame(loop); })();
} else seek(0);
</script>
</body>
</html>
