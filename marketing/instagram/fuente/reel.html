<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel PaMen</title>
<style>
@font-face { font-family: "Anton"; src: url("fonts/Anton.font") format("truetype"); }
@font-face { font-family: "Archivo Black"; src: url("fonts/ArchivoBlack.font") format("truetype"); }
:root { --bg:#0b0b0c; --fg:#fafafa; --acc:#ffe14a; --ink:#0b0b0c; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; background:var(--bg); overflow:hidden; }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--bg); font-family:"Anton", sans-serif; color:var(--fg); }
#glow { position:absolute; inset:-300px; background:radial-gradient(circle at 50% 45%, rgba(255,225,74,.16), transparent 45%); }
#grain { position:absolute; inset:0; opacity:.09; pointer-events:none; mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
#vignette { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65)); pointer-events:none; }
#brand { position:absolute; top:250px; left:0; right:0; text-align:center; font-family:"Archivo Black"; font-size:30px; letter-spacing:.32em; color:rgba(250,250,250,.75); }
#brand b { color:var(--acc); font-weight:400; }

.scene { visibility:hidden; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.inner { display:flex; flex-direction:column; align-items:center; transform-origin:50% 50%; margin-top:-80px; }
.line { display:flex; gap:.22em; line-height:.98; text-transform:uppercase; white-space:nowrap; }
.w { display:inline-block; position:relative; }
.box { position:relative; display:inline-block; padding:.04em .16em .02em; color:var(--ink); margin-top:.08em; }
.box > i { position:absolute; inset:0; background:var(--acc); transform-origin:0 50%; z-index:0; transform:rotate(-1.5deg); }
.box > span { position:relative; z-index:1; display:inline-block; }
.y { color:var(--acc); }
.out { color:transparent; -webkit-text-stroke:4px var(--acc); }

.pill { font-family:"Archivo Black"; font-size:34px; letter-spacing:.12em; padding:16px 34px; border:3px solid var(--acc); color:var(--acc); border-radius:999px; margin-bottom:46px; }
.q { position:absolute; font-family:"Anton"; color:transparent; -webkit-text-stroke:3px rgba(255,225,74,.55); }

.urlbar { margin-top:70px; display:flex; align-items:center; gap:22px; background:#fff; color:#111; border-radius:999px; padding:30px 52px; font-family:"Inter", sans-serif; font-weight:700; font-size:54px; box-shadow:0 24px 60px rgba(0,0,0,.5), 0 0 0 6px rgba(255,225,74,.25); min-width:820px; position:relative; }
.urlbar svg { flex:none; }
.caret { display:inline-block; width:5px; height:58px; background:#111; margin-left:4px; vertical-align:middle; }
.cursor { position:absolute; right:40px; bottom:-90px; }

.bubble { position:relative; margin-top:50px; background:var(--acc); color:var(--ink); border-radius:80px; padding:6px 100px 0; font-size:320px; line-height:1.05; }
.bubble::after { content:""; position:absolute; left:120px; bottom:-60px; border-left:0 solid transparent; border-right:90px solid transparent; border-top:90px solid var(--acc); }
.hint { margin-top:100px; font-family:"Archivo Black"; font-size:40px; letter-spacing:.06em; color:rgba(250,250,250,.85); text-transform:uppercase; }
.hint b { color:var(--acc); font-weight:400; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>

  <div id="brand">PAMEN <b>AGENCY</b></div>

  <!-- 1 · Para de scrollear -->
  <div class="scene" id="s1"><div class="inner">
    <div class="pill" id="s1pill">ALTO AHÍ ✋</div>
    <div class="line" style="font-size:220px"><span class="w" id="s1a">PARA</span><span class="w" id="s1b">DE</span></div>
    <div class="line" style="font-size:196px"><span class="box" id="s1c"><i></i><span>SCROLLEAR</span></span></div>
  </div></div>

  <!-- 2 · y ponte a trabajar -->
  <div class="scene" id="s2"><div class="inner">
    <div class="line" style="font-size:190px"><span class="w" id="s2a">Y</span><span class="w" id="s2b">PONTE</span><span class="w" id="s2c">A</span></div>
    <div class="line" style="font-size:220px"><span class="box" id="s2d"><i></i><span>TRABAJAR</span></span></div>
  </div></div>

  <!-- 3 · ¿no sabes qué hacer o por dónde empezar? -->
  <div class="scene" id="s3">
    <span class="q" id="q1" style="font-size:300px; left:40px; top:330px">?</span>
    <span class="q" id="q2" style="font-size:220px; right:70px; top:470px">?</span>
    <span class="q" id="q3" style="font-size:260px; left:90px; top:1250px">?</span>
    <span class="q" id="q4" style="font-size:340px; right:40px; top:1180px">¿</span>
    <div class="inner" style="line-height:1.1">
      <div class="line" style="font-size:168px; line-height:1.1"><span class="w" id="s3a">¿NO</span><span class="w" id="s3b">SABES</span></div>
      <div class="line" style="font-size:168px; line-height:1.1"><span class="w" id="s3c">QUÉ</span><span class="w" id="s3d">HACER</span></div>
      <div class="line" style="font-size:142px; line-height:1.12"><span class="w out" id="s3e">O POR DÓNDE</span></div>
      <div class="line" style="font-size:210px"><span class="w y" id="s3f">EMPEZAR?</span></div>
    </div>
  </div>

  <!-- 4 · visita nuestra web -->
  <div class="scene" id="s4"><div class="inner">
    <div class="line" style="font-size:230px"><span class="w" id="s4a">VISITA</span></div>
    <div class="line" style="font-size:180px"><span class="box" id="s4b"><i></i><span>NUESTRA WEB</span></span></div>
    <div class="urlbar" id="s4bar">
      <svg width="44" height="52" viewBox="0 0 24 28" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"><rect x="3" y="12" width="18" height="14" rx="3"/><path d="M7 12V8a5 5 0 0 1 10 0v4"/></svg>
      <span><span id="url"></span><span class="caret" id="caret"></span></span>
      <svg class="cursor" id="ptr" width="96" height="120" viewBox="0 0 24 30"><path d="M3 2l16 15h-8l4.5 9-3 1.5L8 18l-5 5z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </div>
  </div></div>

  <!-- 5 · o comenta la palabra IA -->
  <div class="scene" id="s5"><div class="inner">
    <div class="line" style="font-size:150px"><span class="w" id="s5a">O</span><span class="w" id="s5b">COMENTA</span></div>
    <div class="line" style="font-size:132px"><span class="w out" id="s5c">LA PALABRA</span></div>
    <div class="bubble" id="s5d">“IA”</div>
    <div class="hint" id="s5e">👇 Escríbelo en <b>comentarios</b></div>
  </div></div>

  <div id="vignette"></div>
  <div id="grain"></div>
</div>

<script>
const T = 14;               // duración total (s)
const A = [];               // animaciones (todas en pausa, controladas por seek)
const EASE = "cubic-bezier(.16,1,.3,1)";
const POP = "cubic-bezier(.34,1.56,.64,1)";
const $ = id => document.getElementById(id);

function anim(id, kf, start, dur, easing = EASE) {
  const el = typeof id === "string" ? $(id) : id;
  const a = el.animate(kf, { duration: dur * 1000, delay: start * 1000, fill: "both", easing });
  a.pause(); A.push(a);
}
// palabra que "golpea" la pantalla
const slam = (id, t, d = .34) => anim(id, [
  { opacity: 0, transform: "scale(1.9) translateY(-10px)", filter: "blur(14px)" },
  { opacity: 1, transform: "scale(1)", filter: "blur(0)" }], t, d);
// subida desde abajo
const rise = (id, t, d = .45) => anim(id, [
  { opacity: 0, transform: "translateY(90px)", filter: "blur(8px)" },
  { opacity: 1, transform: "translateY(0)", filter: "blur(0)" }], t, d);
// caja amarilla que se dibuja + texto que entra
function boxIn(id, t) {
  const el = $(id);
  anim(el, [{ opacity: 0 }, { opacity: 1 }], t, .01);
  anim(el.querySelector("i"), [{ transform: "rotate(-1.5deg) scaleX(0)" }, { transform: "rotate(-1.5deg) scaleX(1)" }], t, .32);
  anim(el.querySelector("span"), [
    { opacity: 0, transform: "translateX(-40px)" }, { opacity: 1, transform: "translateX(0)" }], t + .12, .34);
}
// visibilidad de escena + salida con "punch"
function scene(id, a, b) {
  const s = $(id);
  const v = s.animate([{ visibility: "visible" }, { visibility: "visible" }], { duration: (b - a) * 1000, delay: a * 1000, fill: "none" });
  v.pause(); A.push(v);
  anim(s.querySelector(".inner"), [
    { opacity: 1, transform: "scale(1)", filter: "blur(0)" },
    { opacity: 0, transform: "scale(1.25)", filter: "blur(18px)" }], b - .16, .16, "ease-in");
}
const shake = (id, t) => anim(id, [
  { transform: "translate(0,0) rotate(0)" }, { transform: "translate(-14px,6px) rotate(-1.2deg)" },
  { transform: "translate(12px,-6px) rotate(1deg)" }, { transform: "translate(-8px,4px) rotate(-.6deg)" },
  { transform: "translate(6px,0) rotate(.4deg)" }, { transform: "translate(0,0) rotate(0)" }], t, .38, "linear");

// marca
anim("brand", [{ opacity: 0, transform: "translateY(-20px)" }, { opacity: 1, transform: "none" }], .1, .6);

// 1 · 0 – 2.6 s
scene("s1", 0, 2.6);
anim("s1pill", [{ opacity: 0, transform: "scale(.6)" }, { opacity: 1, transform: "scale(1)" }], .05, .4, POP);
slam("s1a", .2); slam("s1b", .5); boxIn("s1c", .85);
shake("s1", 1.55);

// 2 · 2.6 – 4.7 s
scene("s2", 2.6, 4.7);
slam("s2a", 2.62, .28); slam("s2b", 2.8, .3); slam("s2c", 3.0, .28); boxIn("s2d", 3.25);
anim("s2d", [{ transform: "scale(1)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], 3.75, .35, "ease-out");

// 3 · 4.7 – 7.9 s
scene("s3", 4.7, 7.9);
rise("s3a", 4.75); rise("s3b", 4.95); rise("s3c", 5.3); rise("s3d", 5.5); rise("s3e", 5.95); slam("s3f", 6.4, .4);
["q1", "q2", "q3", "q4"].forEach((q, i) => {
  anim(q, [{ opacity: 0, transform: "scale(.3) rotate(-30deg)" }, { opacity: 1, transform: "scale(1) rotate(0)" }], 4.8 + i * .18, .5, POP);
  anim($(q), [{ translate: "0 0", rotate: "0deg" }, { translate: `${i % 2 ? -30 : 30}px -60px`, rotate: `${i % 2 ? 12 : -12}deg` }], 5.3, 2.6, "ease-in-out");
});

// 4 · 7.9 – 10.5 s
scene("s4", 7.9, 10.5);
slam("s4a", 7.95); boxIn("s4b", 8.25);
anim("s4bar", [{ opacity: 0, transform: "translateY(80px) scale(.9)" }, { opacity: 1, transform: "none" }], 8.55, .5, POP);
anim("ptr", [{ opacity: 0, transform: "translate(160px,160px)" }, { opacity: 1, transform: "translate(0,0)" }], 9.45, .4);
anim("s4bar", [{ scale: "1" }, { scale: ".94" }, { scale: "1.04" }, { scale: "1" }], 9.95, .35, "ease-out");

// 5 · 10.5 – 14 s
scene("s5", 10.5, T + 1);
slam("s5a", 10.55, .3); slam("s5b", 10.75, .32); rise("s5c", 11.05);
anim("s5d", [{ opacity: 0, transform: "scale(0) rotate(-12deg)" }, { opacity: 1, transform: "scale(1) rotate(-3deg)" }], 11.4, .55, POP);
anim($("s5d"), [{ scale: "1" }, { scale: "1.06" }, { scale: "1" }, { scale: "1.06" }, { scale: "1" }, { scale: "1.06" }, { scale: "1" }], 12.1, 1.9, "ease-in-out");
rise("s5e", 12.0);

// texto escrito a mano y grano: dependen del tiempo, no de WAAPI
const URL_TXT = "pamenagency.com";
function seek(t) {
  for (const a of A) a.currentTime = t * 1000;
  const n = Math.max(0, Math.min(URL_TXT.length, Math.floor((t - 8.75) / .045)));
  $("url").textContent = URL_TXT.slice(0, n);
  $("caret").style.opacity = (n < URL_TXT.length || Math.floor(t * 2.5) % 2) ? 1 : 0;
  const f = Math.floor(t * 30);
  $("grain").style.backgroundPosition = `${(f * 73) % 260}px ${(f * 151) % 260}px`;
  $("glow").style.transform = `translate(${Math.sin(t * .7) * 80}px, ${Math.cos(t * .5) * 120}px)`;
}
window.seek = seek;
window.TOTAL = T;

if (!location.search.includes("render")) {
  const t0 = performance.now();
  (function loop() { seek(((performance.now() - t0) / 1000) % T); requestAnimationFrame(loop); })();
} else seek(0);
</script>
</body>
</html>
