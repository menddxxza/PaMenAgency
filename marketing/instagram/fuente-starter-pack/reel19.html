<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel 19 PaMen</title>
<style>
@font-face { font-family: "Anton"; src: url("fonts/Anton.font") format("truetype"); }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:#ece9e2; }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:"Inter", Arial, sans-serif; color:#111; perspective:2200px;
  background:#ece9e2 radial-gradient(circle at 50% 40%, #fff 0%, #ece9e2 70%); }
#brand { position:absolute; top:70px; left:0; right:0; text-align:center; font-weight:900; font-size:26px; letter-spacing:.35em; color:rgba(0,0,0,.45); }

.cap { position:absolute; left:0; right:0; top:150px; display:flex; flex-direction:column; align-items:center; gap:12px; z-index:20; }
.cap span { background:#fff; color:#000; font-weight:900; font-size:52px; line-height:1.15; padding:12px 28px; border-radius:20px; text-align:center; box-shadow:0 10px 26px rgba(0,0,0,.15); }
.cap .w { background:#111; color:#ffe14a; font-size:36px; padding:8px 22px; }

#flip { position:absolute; left:60px; top:340px; width:960px; height:1180px; transform-style:preserve-3d; }
.face { position:absolute; inset:0; background:#fff; border-radius:12px; box-shadow:0 30px 70px rgba(0,0,0,.18); overflow:hidden; }
.back { transform:rotateY(180deg); }
.title { padding:40px 48px 0; font-family:Arial, "Inter", sans-serif; font-weight:900; font-size:76px; letter-spacing:-.02em; line-height:1; }
.title small { display:block; font-size:44px; font-weight:700; margin-top:10px; letter-spacing:0; }
.it { position:absolute; width:400px; text-align:center; }
.it .e { font-size:170px; line-height:1.05; filter:drop-shadow(0 8px 0 #fff) drop-shadow(0 -8px 0 #fff) drop-shadow(8px 0 0 #fff) drop-shadow(-8px 0 0 #fff) drop-shadow(0 18px 18px rgba(0,0,0,.25)); }
.it .l { font-family:Arial, "Inter", sans-serif; font-weight:700; font-size:38px; line-height:1.15; margin-top:6px; }
.stamp { position:absolute; left:50%; top:52%; font-family:"Anton"; font-size:120px; padding:6px 36px; border:12px solid #16c172; color:#16c172; border-radius:24px; background:rgba(255,255,255,.9); white-space:nowrap; transform:translate(-50%,-50%) rotate(-10deg); opacity:0; z-index:5; }
.stampR { border-color:#ff2d3d; color:#ff2d3d; }

#cta { position:absolute; left:0; right:0; top:1300px; display:flex; flex-direction:column; align-items:center; gap:22px; z-index:25; opacity:0; }
#cta .big { font-family:"Anton"; font-size:96px; line-height:1; text-align:center; text-transform:uppercase; }
#cta .big b { background:#ffe14a; padding:0 16px; font-weight:400; }
#cta .pill { background:#111; color:#fff; font-weight:900; font-size:42px; padding:16px 34px; border-radius:999px; }
</style>
</head>
<body>
<div id="stage">
  <div id="brand">PAMEN AGENCY</div>
  <div class="cap" id="cap"><span>Starter pack del dueño<br>de un negocio 😩</span><span class="w">espera al final 👀</span></div>

  <div id="flip">
    <div class="face front" id="front">
      <div class="title">Starter pack:<small>dueño de negocio (sin IA)</small></div>
    </div>
    <div class="face back" id="back">
      <div class="title" style="color:#0c8f52">Starter pack:<small style="color:#111">dueño de negocio CON IA 😎</small></div>
    </div>
  </div>

  <div id="cta">
    <div class="big">ETIQUETA A QUIEN<br>NECESITA <b>EL SEGUNDO</b> 👇</div>
    <div class="pill">o comenta "IA" y te lo montamos</div>
  </div>
</div>

<script>
const T = 12.5;
const A = [];
const $ = id => document.getElementById(id);
function anim(id, kf, start, dur, easing = "cubic-bezier(.16,1,.3,1)", fill = "both") {
  const el = typeof id === "string" ? $(id) : id;
  const a = el.animate(kf, { duration: dur * 1000, delay: start * 1000, fill, easing });
  a.pause(); A.push(a);
}
// posiciones del collage (desordenado a propósito, como los memes)
const POS = [[40, 230, -6], [520, 210, 5], [60, 580, 4], [500, 560, -4], [30, 900, -3], [520, 880, 6]];
const SIN = [["☕", "El café nº 5 del día"], ["📱", "87 WhatsApps sin leer"], ["📒", "Agenda de papel tachada"], ["🫠", "\"Mañana te lo envío\""], ["🪫", "El móvil al 2%"], ["🕚", "Contestando a las 23:00"]];
const CON = [["🧘", "Paz mental"], ["🤖", "La IA responde 24/7"], ["📅", "Citas que se agendan solas"], ["🏖️", "Vacaciones de verdad"], ["😴", "8 horas de sueño"], ["📈", "Más ventas"]];

function fill(face, items, t0, step, drop) {
  items.forEach(([e, l], i) => {
    const [x, y, r] = POS[i];
    const d = document.createElement("div"); d.className = "it";
    d.style.left = x + "px"; d.style.top = y + "px";
    d.innerHTML = `<div class="e">${e}</div><div class="l">${l}</div>`;
    face.appendChild(d);
    const t = t0 + i * step;
    if (drop) anim(d, [{ opacity: 0, transform: `translateY(-260px) rotate(${r - 20}deg) scale(1.3)` }, { opacity: 1, transform: `translateY(14px) rotate(${r + 2}deg) scale(.96)`, offset: .7 }, { opacity: 1, transform: `translateY(0) rotate(${r}deg) scale(1)` }], t, .38, "cubic-bezier(.55,0,.4,1)");
    else anim(d, [{ opacity: 0, transform: `scale(0) rotate(${r - 30}deg)` }, { opacity: 1, transform: `scale(1) rotate(${r}deg)` }], t, .42, "cubic-bezier(.34,1.56,.64,1)");
  });
}
// gancho
anim("cap", [{ opacity: 0, transform: "scale(.7)" }, { opacity: 1, transform: "scale(1)" }], 0, .3, "cubic-bezier(.34,1.56,.64,1)");
anim("flip", [{ opacity: 0, translate: "0 80px" }, { opacity: 1, translate: "0 0" }], .1, .35);

// 1 · sin IA: los elementos caen con golpe
fill($("front"), SIN, .55, .48, true);
const st1 = document.createElement("div"); st1.className = "stamp stampR"; st1.textContent = "😩 AGOTADOR"; $("front").appendChild(st1);
anim(st1, [{ opacity: 0, transform: "translate(-50%,-50%) rotate(-10deg) scale(2)" }, { opacity: 1, transform: "translate(-50%,-50%) rotate(-10deg) scale(1)" }], 3.6, .22, "cubic-bezier(.5,0,.3,1.4)");
anim("flip", [{ translate: "0 0" }, { translate: "-14px 0" }, { translate: "12px 0" }, { translate: "-6px 0" }, { translate: "0 0" }], 3.75, .3, "linear", "none");

// 2 · la tarjeta da la vuelta
anim("flip", [{ transform: "rotateY(0) scale(1)" }, { transform: "rotateY(90deg) scale(.88)", offset: .5 }, { transform: "rotateY(180deg) scale(1)" }], 4.7, .9, "cubic-bezier(.6,0,.3,1)");
anim("cap", [{ opacity: 1 }, { opacity: 0 }], 4.7, .3, "ease-in", "forwards");

// 3 · con IA
fill($("back"), CON, 5.8, .38, false);
const st2 = document.createElement("div"); st2.className = "stamp"; st2.textContent = "😎 MUCHO MEJOR"; $("back").appendChild(st2);
anim(st2, [{ opacity: 0, transform: "translate(-50%,-50%) rotate(-10deg) scale(2)" }, { opacity: 1, transform: "translate(-50%,-50%) rotate(-10deg) scale(1)" }], 8.4, .22, "cubic-bezier(.5,0,.3,1.4)");
anim(st2, [{ opacity: 1 }, { opacity: 0 }], 9.25, .25, "ease-in", "forwards");

// 4 · llamada a la acción
anim("flip", [{ translate: "0 0", scale: "1" }, { translate: "0 -250px", scale: ".7" }], 9.4, .55, "cubic-bezier(.16,1,.3,1)");
anim("cta", [{ opacity: 0, transform: "translateY(100px)" }, { opacity: 1, transform: "none" }], 9.65, .5, "cubic-bezier(.34,1.56,.64,1)");
anim($("cta").querySelector(".big"), [{ scale: "1" }, { scale: "1.05" }, { scale: "1" }], 10.8, .5, "ease-in-out", "none");
anim($("cta").querySelector(".big"), [{ scale: "1" }, { scale: "1.05" }, { scale: "1" }], 11.8, .5, "ease-in-out", "none");

function seek(t) {
  for (const a of A) a.currentTime = t * 1000;
  // cambio de cara justo cuando la tarjeta está de canto (mitad del giro)
  const flipped = t >= 5.15;
  $("front").style.visibility = flipped ? "hidden" : "visible";
  $("back").style.visibility = flipped ? "visible" : "hidden";
}
window.seek = seek;
window.TOTAL = T;

if (!location.search.includes("render")) {
  const t0 = performance.now();
  (function loop() { seek(((performance.now() - t0) / 1000) % T); requestAnimationFrame(loop); })();
} else seek(0);
</script>
</body>
</html>
