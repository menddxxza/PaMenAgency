<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel 4 PaMen</title>
<style>
@font-face { font-family: "Anton"; src: url("fonts/Anton.font") format("truetype"); }
@font-face { font-family: "Archivo Black"; src: url("fonts/ArchivoBlack.font") format("truetype"); }
:root { --bg:#0b0b0c; --fg:#fafafa; --acc:#ffe14a; --ink:#0b0b0c; --red:#ff5a4e; --green:#3ddc84; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; background:var(--bg); overflow:hidden; }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--bg); font-family:"Anton", sans-serif; color:var(--fg); }
#glow { position:absolute; inset:-300px; background:radial-gradient(circle at 50% 42%, rgba(255,225,74,.15), transparent 45%); }
#grain { position:absolute; inset:0; opacity:.09; pointer-events:none; mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
#vignette { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65)); pointer-events:none; }
#brand { position:absolute; top:70px; left:0; right:0; text-align:center; font-family:"Archivo Black"; font-size:28px; letter-spacing:.32em; color:rgba(250,250,250,.7); }
#brand b { color:var(--acc); font-weight:400; }

.scene { visibility:hidden; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.inner { display:flex; flex-direction:column; align-items:center; padding:0 70px; text-align:center; margin-top:-30px; }
.line { line-height:1.08; text-transform:uppercase; }

.badge { width:200px; height:200px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:110px; margin-bottom:34px; }
.badge.no { border:7px solid var(--red); color:var(--red); }
.badge.yes { border:7px solid var(--green); color:var(--green); background:rgba(61,220,132,.08); }
.tag2 { font-family:"Archivo Black"; font-size:34px; letter-spacing:.14em; margin-bottom:20px; }
.tag2.no { color:var(--red); }
.tag2.yes { color:var(--green); }
.claim { font-size:96px; }

.sub { font-family:"Archivo Black"; font-size:34px; letter-spacing:.1em; color:rgba(250,250,250,.65); margin-top:22px; text-transform:uppercase; }
.box { position:relative; display:inline-block; padding:.04em .16em .02em; color:var(--ink); margin-top:.1em; }
.box > i { position:absolute; inset:0; background:var(--acc); transform-origin:0 50%; z-index:0; transform:rotate(-1.3deg); }
.box > span { position:relative; z-index:1; display:inline-block; }

.urlbar { margin-top:60px; display:flex; align-items:center; gap:18px; background:#fff; color:#111; border-radius:999px; padding:24px 42px; font-family:"Inter", sans-serif; font-weight:700; font-size:42px; box-shadow:0 24px 60px rgba(0,0,0,.5), 0 0 0 6px rgba(255,225,74,.25); }
.hint { margin-top:50px; font-family:"Archivo Black"; font-size:36px; letter-spacing:.06em; color:rgba(250,250,250,.85); text-transform:uppercase; }
.hint b { color:var(--acc); font-weight:400; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="brand">PAMEN <b>AGENCY</b></div>

  <!-- 0 · Intro -->
  <div class="scene" id="s0"><div class="inner">
    <div class="line" style="font-size:150px" id="s0a">MITO</div>
    <div class="line" style="font-size:90px; margin:6px 0" id="s0vs">VS</div>
    <div class="line" style="font-size:150px" id="s0b">REALIDAD</div>
    <div class="sub" id="s0c">SOBRE LA IA EN TU NEGOCIO</div>
  </div></div>

  <!-- 1 · Mito 1 -->
  <div class="scene" id="s1"><div class="inner">
    <div class="badge no" id="b1">✕</div>
    <div class="tag2 no" id="t1tag">MITO</div>
    <div class="line claim" id="t1a">"LA IA ES SOLO</div>
    <div class="line claim" id="t1b">PARA EMPRESAS</div>
    <div class="line claim" id="t1c">GRANDES"</div>
  </div></div>

  <!-- 2 · Realidad 1 -->
  <div class="scene" id="s2"><div class="inner">
    <div class="badge yes" id="b2">✓</div>
    <div class="tag2 yes" id="t2tag">REALIDAD</div>
    <div class="line claim" id="t2a">CUALQUIER NEGOCIO</div>
    <div class="line claim" id="t2b">PUEDE <span class="box" id="t2box"><i></i><span>EMPEZAR HOY</span></span></div>
  </div></div>

  <!-- 3 · Mito 2 -->
  <div class="scene" id="s3"><div class="inner">
    <div class="badge no" id="b3">✕</div>
    <div class="tag2 no" id="t3tag">MITO</div>
    <div class="line claim" id="t3a">"CUESTA</div>
    <div class="line claim" id="t3b">UNA FORTUNA"</div>
  </div></div>

  <!-- 4 · Realidad 2 -->
  <div class="scene" id="s4"><div class="inner">
    <div class="badge yes" id="b4">✓</div>
    <div class="tag2 yes" id="t4tag">REALIDAD</div>
    <div class="line claim" id="t4a">CUESTA MENOS QUE</div>
    <div class="line claim" id="t4b"><span class="box" id="t4box"><i></i><span>UN EMPLEADO</span></span></div>
  </div></div>

  <!-- 5 · CTA -->
  <div class="scene" id="s5"><div class="inner">
    <div class="line" style="font-size:94px" id="s5a">DEJA DE CREER</div>
    <div class="line" style="font-size:94px" id="s5b">MITOS</div>
    <div class="urlbar" id="s5bar">
      <svg width="34" height="40" viewBox="0 0 24 28" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"><rect x="3" y="12" width="18" height="14" rx="3"/><path d="M7 12V8a5 5 0 0 1 10 0v4"/></svg>
      <span>pamenagency.com</span>
    </div>
    <div class="hint" id="s5hint">👇 O comenta <b>"IA"</b></div>
  </div></div>

  <div id="vignette"></div>
  <div id="grain"></div>
</div>

<script>
const T = 15.2;
const A = [];
const EASE = "cubic-bezier(.16,1,.3,1)";
const POP = "cubic-bezier(.34,1.56,.64,1)";
const $ = id => document.getElementById(id);

function anim(id, kf, start, dur, easing = EASE) {
  const el = typeof id === "string" ? $(id) : id;
  const a = el.animate(kf, { duration: dur * 1000, delay: start * 1000, fill: "both", easing });
  a.pause(); A.push(a);
}
const slam = (id, t, d = .34) => anim(id, [
  { opacity: 0, transform: "scale(1.9) translateY(-10px)", filter: "blur(14px)" },
  { opacity: 1, transform: "scale(1)", filter: "blur(0)" }], t, d);
const rise = (id, t, d = .45) => anim(id, [
  { opacity: 0, transform: "translateY(90px)", filter: "blur(8px)" },
  { opacity: 1, transform: "translateY(0)", filter: "blur(0)" }], t, d);
function boxIn(id, t) {
  const el = $(id);
  anim(el, [{ opacity: 0 }, { opacity: 1 }], t, .01);
  anim(el.querySelector("i"), [{ transform: "rotate(-1.3deg) scaleX(0)" }, { transform: "rotate(-1.3deg) scaleX(1)" }], t, .3);
  anim(el.querySelector("span"), [
    { opacity: 0, transform: "translateX(-40px)" }, { opacity: 1, transform: "translateX(0)" }], t + .1, .32);
}
function scene(id, a, b) {
  const s = $(id);
  const v = s.animate([{ visibility: "visible" }, { visibility: "visible" }], { duration: (b - a) * 1000, delay: a * 1000, fill: "none" });
  v.pause(); A.push(v);
  anim(s.querySelector(".inner"), [
    { opacity: 1, transform: "scale(1)", filter: "blur(0)" },
    { opacity: 0, transform: "scale(1.2)", filter: "blur(14px)" }], b - .14, .14, "ease-in");
}
function badgePunch(id, t, strike) {
  anim(id, [
    { opacity: 0, transform: "scale(.2) rotate(-25deg)" },
    { opacity: 1, transform: "scale(1.15) rotate(5deg)" },
    { opacity: 1, transform: "scale(1) rotate(0)" }], t, .46, POP);
  if (strike) anim(id, [{ background: "transparent" }, { background: "rgba(255,90,78,.1)" }], t + .1, .2, "linear");
}

anim("brand", [{ opacity: 0, transform: "translateY(-20px)" }, { opacity: 1, transform: "none" }], .1, .5);

// 0 · Intro · 0 – 2.3s
scene("s0", 0, 2.3);
slam("s0a", .15, .3); slam("s0vs", .45, .26); slam("s0b", .68, .32);
rise("s0c", 1.2);

// 1 · Mito 1 · 2.3 – 4.7s
scene("s1", 2.3, 4.7);
badgePunch("b1", 2.38, true);
rise("t1tag", 2.78);
rise("t1a", 3.05); rise("t1b", 3.25); rise("t1c", 3.45);

// 2 · Realidad 1 · 4.7 – 7.1s
scene("s2", 4.7, 7.1);
badgePunch("b2", 4.78, false);
rise("t2tag", 5.18);
rise("t2a", 5.45); rise("t2b", 5.68); boxIn("t2box", 6.05);

// 3 · Mito 2 · 7.1 – 9.3s
scene("s3", 7.1, 9.3);
badgePunch("b3", 7.18, true);
rise("t3tag", 7.58);
rise("t3a", 7.85); rise("t3b", 8.08);

// 4 · Realidad 2 · 9.3 – 11.7s
scene("s4", 9.3, 11.7);
badgePunch("b4", 9.38, false);
rise("t4tag", 9.78);
rise("t4a", 10.05); rise("t4b", 10.28); boxIn("t4box", 10.65);

// 5 · CTA · 11.7 – 15.2s
scene("s5", 11.7, T + 1);
slam("s5a", 11.78, .3); slam("s5b", 12.05, .3);
anim("s5bar", [{ opacity: 0, transform: "translateY(70px) scale(.9)" }, { opacity: 1, transform: "none" }], 12.5, .5, POP);
rise("s5hint", 13.1);
anim($("s5bar"), [{ scale: "1" }, { scale: "1.05" }, { scale: "1" }], 13.65, .4, "ease-out");

function seek(t) {
  for (const a of A) a.currentTime = t * 1000;
  const f = Math.floor(t * 30);
  $("grain").style.backgroundPosition = `${(f * 73) % 260}px ${(f * 151) % 260}px`;
  $("glow").style.transform = `translate(${Math.sin(t * .7) * 70}px, ${Math.cos(t * .5) * 100}px)`;
}
window.seek = seek;
window.TOTAL = T;

if (!location.search.includes("render")) {
  const t0 = performance.now();
  (function loop() { seek(((performance.now() - t0) / 1000) % T); requestAnimationFrame(loop); })();
} else seek(0);
</script>
</body>
</html>
